# Spawn the city's token auditor on a slow cadence.
#
# Unlike token-spike-watch (mechanical, catches sudden jumps), this starts a
# SESSION whose own model reads the usage report, attributes spend to agents and
# rigs, and files findings into switchyard. It costs real tokens, so its cadence
# is deliberately slow.
#
# WHY 7 DAYS. The auditor's findings are about CONFIGURATION — wake cadence,
# prompt size, pool ceilings, idle timeouts. Those change when a human changes
# them, not hourly, so a daily audit would re-derive the same findings and file
# the same items against a city nobody has touched. A week is also the shortest
# window that makes the strongest class of finding legible: cost-per-closed-bead
# ratios need enough closed beads to be a ratio rather than an anecdote.
#
# THE CADENCE IS NOT THE ENFORCING GUARD. The reconciler's revive loop spawns
# lanes without consulting an interval, so this 168h figure bounds the scheduled
# path only — the same gap measured on the refactor-scout lane, where the order
# fired 0 times in 24h while the lane ran 29 passes (switchyard issue 163). What
# actually enforces "nothing new to attribute, so do not pay for a session" is
# the pre-spawn demand gate this order now execs
# (assets/scripts/token-audit.sh): no new lines in the city's usage sink since
# the last audit means no spawn, at the cost of one marker read.
#
# The spike watch is what covers the fast axis. If a spike lands, the mayor gets
# mail within 6h and can wake an auditor immediately:
#   gc session new switchyard-ops.token-auditor --no-attach
#
# The session exits IDLE when it has nothing to file, so a pass on a steady city
# costs one cheap report read, not a spin.
[order]
description = "Start the city token auditor weekly; it attributes spend to agents/rigs and files findings into switchyard"
trigger = "cooldown"
interval = "168h"
exec = "$PACK_DIR/assets/scripts/token-audit.sh"
