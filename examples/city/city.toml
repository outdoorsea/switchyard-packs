# Example city.toml. Copy to your city root and edit.
#
# city.toml is DELIBERATELY machine-specific: it is the rig roster this box
# runs, plus pool tuning and operational holds. Keep it OUT of any shared repo —
# the portable pins live in pack.toml. Two machines running the same packs will
# have different city.toml files, and that is correct.
#
# NOTE: `gc rig add` / `gc rig resume` REWRITE this file and drop comments.
# After any gc command that rewrites config, re-check your [[patches.agent]]
# blocks. The config-drift order mails the mayor when the tracked surface
# diverges from git HEAD.

[workspace]
provider = "claude"

[providers]
  [providers.claude]
    base = "builtin:claude"

  # REQUIRED, even if you never authenticate deepseek's wrapper CLI.
  #
  # switchyard-ops' judge and security-scout name this provider deliberately —
  # they validate and review code on a model that does not share the blind spots
  # of the one that wrote it. A referenced-but-absent provider does NOT degrade
  # gracefully: it rejects the WHOLE city config, so `gc agent list`,
  # `gc order list` and `gc config show` all fail with "provider catalog is
  # missing referenced providers", not just those agents.
  #
  # deepseek is a WRAPPED provider: it spawns the `opencode` CLI, which holds
  # its own credential store — so the binary to install and authenticate is
  # `opencode`, and no DEEPSEEK_API_KEY env var is involved.
  #
  # Declaring it is not the same as configuring it. judge-sweep tests the
  # wrapper's own answer, so an unauthenticated opencode leaves the judge lane
  # dormant with a named reason rather than in a silent spawn-fail loop;
  # security-scan has no such probe yet, so there an unauthenticated wrapper
  # still reaches the spawn and reads as a generic startup failure.
  # (`gc doctor --fix` would add a `builtin:deepseek` alias, which is NOT what
  # this pack's lanes run — write this stanza as shown.)
  #
  # ⚠ WHICH MODEL OPENCODE RUNS IS NOT SET HERE, and that is the one thing to
  # get right about this stanza. `model` is a REJECTED provider key (see
  # packs/docs/GAS-CITY-MECHANICS.md), so a model can only be pinned through
  # `args`/`env` — and with neither, gc spawns bare `opencode`, which picks a
  # model from opencode's OWN config. opencode is vendor-agnostic, so an
  # operator who authenticates it against the same vendor as `[workspace]
  # provider` above gets a judge and a security reviewer reasoning on the very
  # model that wrote the code. Nothing detects that: the runtime-diversity CI
  # job compares provider NAMES, and both halves still read "deepseek". Point
  # opencode at a genuinely different vendor, or pin one here, e.g.:
  #   args = ["--model", "deepseek/deepseek-v4-flash-free"]
  [providers.deepseek]
    base = "builtin:opencode"

# --- One rig per product. Each imports gascity's roles (the build-lane role ---
# --- targets its formulas dispatch to) and the switchyard-mcp overlay (so ----
# --- its coordinator can drive switchyard). ---------------------------------
[[rigs]]
name = "example-rig"
prefix = "ex"
default_branch = "main"

# A bare `gc sling <bead>` with no target picks one of these at random. Name the
# worker pool here and dispatch never has to know an agent's name.
# (These keys must precede [rigs.imports] — a bare key after a subtable header
# would be parsed as belonging to that subtable.)
default_sling_targets = ["example-rig/switchyard-ops.brakeman"]

# NO formula_vars ARE REQUIRED HERE.
#
# If you are migrating a rig off the gastown lane, DELETE its
# `formula_vars = { binding_prefix = "gastown." }` line. That setting existed
# because gastown's mol-polecat-work rendered its refinery handoff target from
# the binding of the pack that COOKED the formula (switchyard-ops), producing a
# handoff to an agent nobody ships — silently stranding the bead. There is no
# refinery and no handoff in a gascity city: the worker opens its own PR. The
# setting is now inert, and leaving it in place is misleading rather than
# harmful.

  [rigs.imports]
    # gascity's role agents (gc.implementation-worker, gc.publisher,
    # gc.run-operator, ...) — the targets sy-item-work's steps dispatch to.
    # Bound as `gc` to match the binding its formulas expect.
    [rigs.imports.gc]
      source = "https://github.com/gastownhall/gascity-packs/tree/main/gascity/roles"
      version = "sha:<pin-a-gascity-packs-commit>"
    [rigs.imports.switchyard-mcp]
      source = "https://github.com/outdoorsea/switchyard-packs/tree/main/switchyard-mcp"
      version = "sha:<pin-a-mirror-commit>"
    # switchyard-ops is NOT imported here. Its single city-scope import
    # (pack.toml) already gives this rig a brakeman pool; importing it again at
    # rig scope would register every order a second time. Sling with:
    #   gc sling example-rig/switchyard-ops.brakeman ex-1234

# --- Coordinators: pinned. Workers: elastic. -------------------------------
# A coordinator is a long-lived crew agent that owns one rig's switchyard
# project. Pin it with min_active_sessions = 1 and switchyard-ops will discover
# it automatically — no roster to maintain.
#
# EXCEPTION — singleton aliases: if a coordinator's alias is held by a manual
# session you start yourself, do NOT pin it. min=1 does not keep your session
# alive (the reconciler only counts sessions it spawned); it mints a SECOND
# session that fights the alias. Leave it min=0 and list it in
# roster.conf's PINNED_EXTRA so loop-health wakes the alias instead.
#
# [[patches.agent]]
#   dir = "example-rig"
#   name = "coordinator"
#   min_active_sessions = 1
#   max_active_sessions = 1

# --- Session settings worth setting on day one ------------------------------
# The defaults are tuned for a small repo and bite hard on a large one.
#
# setup_timeout bounds pre_start — which is `git worktree add` over your whole
# rig. Its 10s default kills every pool spawn on a repo of any size, and the
# failure reads as "pre_start[0]: context deadline exceeded" rather than as a
# timeout you can tune. Setting setup_max_timeout switches it to activity-aware:
# setup_timeout then bounds output SILENCE and setup_max_timeout bounds total
# runtime.
[session]
  startup_timeout  = "300s"   # default 60s; a cold start herd overruns it
  setup_timeout    = "120s"   # default 10s
  setup_max_timeout = "10m"

# --- Token hardening (recommended; see docs/TOKEN-HARDENING.md) -------------
# A gascity city has far less always-on surface than a gastown one — there is no
# deacon, boot, or per-rig witness waking on a heartbeat to find no work — so the
# idle bill is dominated by whatever YOU pin: the mayor, plus one coordinator per
# rig.
#
# Coordinators are the tier worth pinning and the tier worth watching. Pin them
# min=1/max=1 so switchyard-ops discovers them automatically, then give the
# mechanical ones a cheap model:
#
# [[patches.agent]]
#   name = "example-rig/coordinator"
#   min_active_sessions = 1
#   max_active_sessions = 1
#   idle_timeout = "168h"
#
# Note the cost/attention trade this pack cannot make for you: the always-on
# patrol tier gastown provided (witness, deacon) is genuinely absent here.
# That is cheaper, and it also means nothing is watching for stuck beads or
# expired leases. See docs/OPERATING-MODEL.md, "What you give up".
#
# Verify a patch landed:  gc config show | grep -A12 'name = "coordinator"'
