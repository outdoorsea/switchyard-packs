# switchyard-ops — the 24-hour heartbeat for any Gas City driven by switchyard.
#
# Encodes the continuous-improvement loop as mechanical exec orders:
#   pool-spawn     — spawn a brakeman for a rig with claimable demand + assign it (1m)
#   publish-gate   — report worker beads closed with no pull request (5m)
#   judge-sweep    — keep a judging-validator draining the awaiting-validation backlog (30m)
#   answer-sweep   — keep an answerer clearing open PRD questions (20m)
#   loop-health    — pinned coordinators alive + status probe honest (30m)
#   intake-sweep   — nudge coordinators to triage switchyard intake (4h)
#   nightly-retro  — nudge the retro agent to draft daily reports (24h)
#   stray-reaper   — detect sessions from foreign/stale city paths (6h)
#   config-drift   — config-as-code guard (6h; no-ops if the city isn't a repo)
#   events-rotate  — cap .gc/events.jsonl to a recent tail (24h; gc has no retention)
#   scratch-reaper — report/prune orphaned gc-scratch dirs at the city root (6h)
#   disk-watch     — mail the mayor when a path crosses a size threshold (12h)
#   token-spike-watch — mail the mayor when a day's token usage exceeds the median
#                    of prior days by a factor (6h; MECHANICAL, zero LLM)
#   security-scan  — start one security-scout per rig, if its provider is
#                    configured (12h)
#   token-audit    — start the city token auditor (7d)
#   refactor-scan  — start one refactor-scout per rig (7d)
#
# Governing invariant: every silent failure becomes mail to the mayor within
# one order cycle.
#
# ...and ships three agents — the switchyard product-cycle lanes that run as a
# session's OWN reasoning (the north star: the server does deterministic checks
# only; every judgment/answer is an external connected agent). Each is scope=rig,
# min=0, and is started on demand by a sweep order above; none is slung gc beads —
# their queue is switchyard's, read over the switchyard MCP inside the session:
#   brakeman       — the worker/BUILDER pool. This is what you sling beads to.
#                    Runs this pack's own sy-item-work (formulas/), which extends
#                    gascity's implementation-base and adds the publish leg:
#                    build, push, open a PR, then close. Nothing merges for it.
#   judge          — the judging-VALIDATOR lane (PRD #177). Records reasoned,
#                    CITED verdicts on delivered criteria that declare no
#                    verify_command — the ones no automated validator can reach.
#                    A SEPARATE identity is mandatory, not stylistic: the server
#                    refuses a judgment verdict from the criterion's builder (SoD)
#                    OR its author, and the coordinator authors the PRDs — so only
#                    a non-authoring judge can validate them. Started by judge-sweep.
#   answerer       — the ANSWERER lane (PRD #34/#171). Answers open human→agent PRD
#                    questions from the repo's code + history, recommends on the
#                    ones that are really human decisions. Latency upgrade over the
#                    coordinator's 4h intake sweep. Started by answer-sweep.
#   security-scout — the SECURITY-REVIEW lane, run on an INDEPENDENT PROVIDER
#                    (kimi) so it does not share the blind spots of the model it
#                    reviews. Scans the diff since its last pass, files findings
#                    into switchyard, and is the ONLY lane allowed to change code
#                    on its own initiative — high severity only, on a branch, as a
#                    PR, NEVER merged. Started by security-scan, which refuses to
#                    spawn until the provider is actually usable (an unconfigured
#                    provider would otherwise be a silent spawn-fail loop).
#   refactor-scout — the REFACTOR-PROPOSAL lane. Ranks structural problems by
#                    evidence (churn, defect clustering, coupling, DRIFTED
#                    duplication) and files at most 3 proposals per pass. Writes
#                    NO code: a refactor's value depends on the team agreeing it
#                    is the right shape, so a human decides and the normal worker
#                    pool builds it. Started by refactor-scan.
#   token-auditor  — the SPEND-REVIEW lane, and the only CITY-SCOPED agent here
#                    (spend is a city property, and the useful comparisons are
#                    cross-rig). Attributes .gc/usage.jsonl to agents and rigs via
#                    assets/scripts/token-report.sh, then files findings that
#                    clear a four-part evidence bar. Reports, never tunes: a wrong
#                    [[patches.agent]] name makes `gc config show` exit 1 and
#                    rejects the WHOLE city config. Started by token-audit.
#
# TOKEN WORK — WHO OWNS WHICH AXIS. There are two distinct token costs, and
# conflating them duplicates work already in flight:
#   * the switchyard API/MCP RESPONSE SURFACE (per-row duplication, static prose,
#     unbounded list reads) is switchyard PRD #281, priority 1, executing.
#   * GAS CITY WAKE/RESPAWN COST and per-agent spend attribution is this pack's
#     (docs/TOKEN-HARDENING.md + token-auditor). PRD #281 lists both of these as
#     explicitly out_of_scope, so they are nobody else's job.
# Measured here: 681,270 cache-read tokens against 20 input and 8,213 output —
# ~99% of spend is RE-READING CONTEXT, not generating text. Optimising output
# length is optimising the wrong term by orders of magnitude.
# Sessions in each pool are named after railway occupations (see each namepool.txt:
# brakeman = trades, judge = inspectors, answerer = dispatchers).
#
# LANES NOT YET SHIPPED AS AGENTS (documented so the gap is a decision, not an
# oversight — the companion defines these lanes: work, answer, validate, judge,
# triage, dedup, covered-by, watch):
#   triager     — issue auto-triage. NOT a separate agent: the coordinator is
#                 allowed to triage and intake-sweep already nudges it. A dedicated
#                 triager would only duplicate it (triage is "recommend, human
#                 decides").
#   validate    — the automated (contract) validator: re-runs a criterion's
#                 verify_command. Purely mechanical, so it belongs to the
#                 switchyard-companion `validate` daemon, not an LLM session.
#                 ⚠ ITS STATED PRECONDITION IS NOW MET. This entry used to say
#                 "today it has nothing to do (contract_bearing coverage is ~0)"
#                 and deferred wiring the daemon until coverage rose. It has:
#                 groundspeak/forge PRD #287 dispatched 17 criteria of which
#                 ~100% declare a runnable `go test ./... -run Test...` command
#                 (measured 2026-07-31). That backlog is reachable by NEITHER
#                 shipped lane — `judge` deliberately takes only criteria with NO
#                 command, so it declines every one of these, and no companion
#                 runs. A fully contract-bearing PRD is therefore the WORST case
#                 for acceptance today, not the best: nothing can sign it off.
#                 Wire `switchyard-companion validate`; still do not add an LLM
#                 agent for it. ⚠ WHEN YOU DO: `validate_main_branch` must name
#                 the branch the criteria actually LAND on. The lane validates
#                 "against merged main" and defaults to `main`; under a
#                 one-integration-branch-per-PRD policy the code sits on
#                 prd-<N>-<slug> until the whole PRD merges, so the default runs
#                 every contract against a tree without the code — and a `fail`
#                 verdict RESETS the criterion for re-work. It would undo
#                 delivered work while reporting success. Point it at the
#                 integration branch, give it a DEDICATED clean clone (the
#                 freshness gate refuses a dirty tree, and a rig checkout is
#                 dirty by construction), and leave validate_skip_repo_check
#                 false — an automated `done` is terminal.
#   watch       — the event bridge (companion `watch`: switchyard SSE → gc session
#                 wake). The high-value missing piece, but a DAEMON/order, not an
#                 agent: it would let judge/answer/triage be woken the instant a
#                 criterion is delivered or a question opens, turning the 20-30m
#                 polls above into a safety net. Ship as its own order once the
#                 wake wiring is exercised end to end (it can spam wakes if wrong).
#   dedup /     — issue duplicate-merge proposals / covered-by-existing-PRD
#   covered-by    linkage. Coordinator-adjacent, low urgency; companion daemons
#                 (`dedup`) exist. Add only if the issue backlog warrants it.
#
# IMPORT AT CITY SCOPE ONLY — `[imports.switchyard-ops]` in pack.toml.
# One city import yields BOTH the orders and a brakeman pool in every rig: gc
# expands a pack's rig-scoped agents into each rig from the city import. Adding
# `[rigs.imports.switchyard-ops]` on top registers every order a SECOND time
# under that rig — duplicate nudges, duplicate mail. To keep workers out of a
# rig, suspend the agent there ([[patches.agent]] suspended = true) rather than
# withholding the import.
#
# CITY-AGNOSTIC: this pack names no rig, and the only agent it names is its own.
# The liveness roster is derived from `gc agent list --json` (pool.min >= 1, not
# suspended). Anything gc cannot express — singleton aliases, which agent runs
# the retro — lives in a city-local, un-versioned $GC_PACK_STATE_DIR/roster.conf.
# See assets/roster.conf.example.
#
# Requires: jq, tmux, and the gascity pack (sy-item-work extends its
# implementation-base and dispatches to its gc.implementation-worker /
# gc.publisher / gc.run-operator role targets — import gascity/roles per rig).
# A `gh` or `glab` on PATH, authenticated for the rig's forge, since the worker
# opens its own pull request. And — for the sweeps to be useful — the
# switchyard-mcp overlay in any rig whose coordinator should drive switchyard.
#
# Requires a RESIDENT MAYOR. gascity ships no always-on crew, so `gc init` writes
# a city-local agents/mayor/ and you declare its [[named_session]] yourself. Every
# escalation in this pack is `gc mail send mayor`, and all of those calls redirect
# to /dev/null — with no mayor the entire escalation path fails silently, which
# defeats the pack's one governing invariant.
#
# Import city-wide:
#   [imports.switchyard-ops]
#   source = "https://github.com/outdoorsea/switchyard-packs/tree/main/switchyard-ops"
#   # ...or from a local checkout of this repo:
#   #   source = "/path/to/switchyard/packs/switchyard-ops"

[pack]
name = "switchyard-ops"
schema = 2
