# judge — the switchyard judging-validator lane, as a Gas City agent.
#
# A judge claims a DELIVERED acceptance criterion that declares no
# `verify_command` — one no automated validator can ever re-run — reads the
# criterion together with the diff that delivered it, and records a
# `validate_criterion` verdict with `judgment` provenance and citations. It is
# the standing owner of switchyard's awaiting-validation backlog: the reasoned
# second lane that PRD #177 specced, run as a session whose OWN model does the
# reasoning (the north-star: the server does deterministic checks only; every
# judgment is an external connected agent).
#
#   gc session new <rig>/switchyard-ops.judge --no-attach
#
# ...which is exactly what the `judge-sweep` order does on a cadence. You do not
# sling work to a judge: its queue is switchyard's, read over the switchyard MCP,
# not the gc bead ledger.
#
# WHY A SEPARATE AGENT, NOT A COORDINATOR NUDGE. Two server rules make judging a
# distinct identity's job, not the coordinator's:
#   1. Separation of duties — `validate_criterion` refuses (409) a verdict from
#      the agent that WORKED the criterion (the satisfying bead's claimed_by).
#   2. Author bar (PRD #177 P0) — it refuses a `judgment` verdict from the agent
#      that AUTHORED the criterion. The coordinator authors and approves the
#      project's PRDs, so a coordinator-run judgment is refused at the door.
# The judge therefore registers under its OWN ref (`<rig>/switchyard-ops.judge`)
# and never builds, authors, or approves anything. That is what lets its verdicts
# stand.
#
# scope = "rig": like the brakeman pool, the judge materializes where the pack is
# imported per rig, and judges THAT rig's switchyard project (via the rig's
# switchyard-mcp overlay scope). A city import yields the orders; a rig import
# yields the workers and the judge.

# WHY A DIFFERENT PROVIDER FROM THE BRAKEMAN POOL (switchyard PRD #271).
#
# Everything above buys IDENTITY independence: the judge registers under its own
# ref, so the server's two separation-of-duties rules can see that the validator
# is not the builder. But both refs can still be the same LLM, and then the judge
# is asked to catch the class of mistake it would itself have made — a model's
# systematic blind spot passes its own work, and both SoD rules read green while
# it happens. Identity independence without RUNTIME independence is a quorum of
# one wearing two badges.
#
# The brakeman pool declares NO provider, so it runs the city default
# (`[workspace] provider` — `claude` in every city that ships this pack). Pinning
# the judge to a different provider here is what makes builder and validator
# genuinely different brains. This is the PACK-SIDE half of the property; the
# SERVER-SIDE half is PRD #249, which refuses a judgment verdict whose recorded
# runtime matches the builder's. The two are complements, not duplicates: this
# line makes the refusal never need to fire.
#
# WHY `kimi` SPECIFICALLY, AND NOT A THIRD PROVIDER. security-scout already pins
# `kimi`, so every city importing this pack is ALREADY required to declare
# `[providers.kimi]` — a referenced-but-absent provider does not degrade
# gracefully, it rejects the WHOLE city config (`gc agent list`, `gc order list`
# and `gc config show` all fail). Reusing the provider the pack already names
# therefore adds ZERO new city.toml requirement; naming a third one would break
# every city until its config caught up. Sharing a runtime with security-scout is
# acceptable and self-correcting: the scout is the only other lane that opens
# PRs, and PRD #249's server-side gate refuses a judgment on work whose builder
# shared this runtime rather than banking it wrongly.
#
# ⚠ PROVIDER PREREQUISITES — same three as security-scout: the `kimi` CLI on
# PATH, `KIMI_API_KEY` in the session environment, and `[providers.kimi]`
# registered in city.toml.
#
# ⚠ UNLIKE security-scout, THIS LANE HAS NO READINESS GUARD. `security-scan.sh`
# checks those three prerequisites and stays quiet when they are unmet;
# `judge-sweep` calls `lane-ensure.sh` directly, and lane-ensure's
# silent-failure invariant mails the mayor whenever a spawn returns no session
# identity. So in a city where kimi is NOT usable, this pin turns the 30m judge
# sweep into a 30m spawn-fail notice and the awaiting-validation backlog stops
# draining. Giving judge-sweep the security-scan readiness check is the right
# fix and is deliberately NOT done here: PRD #271's `hands_off` names the sweep
# orders and lane-ensure mechanics. Until that lands, a city without kimi should
# take the documented opt-out below rather than let the lane fail loudly.
#
# To run the judge on the default provider instead — accepting that builder and
# validator share a runtime brain, which is the whole point of this line — patch
# it off in city.toml rather than editing the pack:
#   [[patches.agent]]
#     dir = "<rig>"
#     name = "switchyard-ops.judge"
#     provider = "claude"
#
# NOTE ON MODEL SELECTION: the model is chosen by the PROVIDER's `args`/`env` in
# city.toml, NOT here. `model` is not a valid agent.toml key — gc silently drops
# it (verified by round-trip against gc 1.4.0), so a `model = "..."` line here
# would look correct and do nothing. This criterion reads "pins a model or
# provider"; only the provider half is real. See packs/docs/GAS-CITY-MECHANICS.md.
provider = "kimi"

scope = "rig"

# fresh: each judging pass starts clean. A judgment is a self-contained read of a
# criterion + its diff; resuming a finished pass replays nothing useful and burns
# the window.
#
# This is load-bearing for the one-PRD-per-session bound (switchyard PRD #329 P1).
# A session takes a single target PRD, judges as much of it as it can, reports
# and exits; the next session resumes that PRD where this one stopped. That only
# drains the backlog because `fresh` hands each pass a clean budget — under
# `resume` the second pass would inherit the first one's spent context and meet
# the same "too large" cliff the bound exists to remove.
wake_mode = "fresh"

# The judge is READ-ONLY except for the verdict it posts over MCP. It never cuts a
# branch or commits, so its cwd is a plain scratch dir, not a build worktree — it
# reads delivered code with `gh pr diff <N>` and `git -C <rig-root> show
# <sha>:<path>`, neither of which touches a working tree.
work_dir = ".gc/worktrees/{{.Rig}}/judge/{{.AgentBase}}"

nudge = "Run one judging pass now: read your prompt, take one target PRD, judge what of its criteria you can with cited verdicts, report the pass, then exit."

idle_timeout = "30m"

# min 0 / max 1: judging is serial and idempotent-per-criterion, but two judges
# racing the same PR is wasted spend and pointless contention (the second write
# just loses). One judge per rig drains the backlog in bounded passes; widen only
# if the backlog dwarfs the drain rate, and only after confirming two judges never
# both post `done` on one criterion. The pool scales to zero between passes; the
# judge-sweep order spawns a fresh one when backlog remains. namepool.txt must hold
# at least max_active_sessions names.
min_active_sessions = 0
max_active_sessions = 1

# A judge is not slung gc beads and runs no gastown formula — its work list is
# switchyard's validation queue, reached over the switchyard MCP. So no
# default_sling_formula and no pre_start worktree setup: the prompt IS the method.
