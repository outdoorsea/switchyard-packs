# Bundle the mergeable pull requests and test the COMBINATION.
#
# The gap: every CI gate in this repo measures a pull request's HEAD, never the
# merge result, so two PRs green against their own bases can be broken together
# and nothing looks until it is on `main` — which Railway auto-deploys. PR #1490
# found two such defects in one hand-built bundle, "neither visible on any PR
# alone".
#
# `pr-gate` and `publish-gate` both DETECT stuck work and neither INTEGRATES.
# This order is the integrating one, and it is the only place in the pack where
# the merge RESULT is measured before a human sees it.
#
# THIS ORDER NEVER MERGES. PRD #340 question 305 decided that deliberately: it
# prepares one bundle, tests it, and hands a person the decision. A green
# combination still ends in mail, not a merge. Do not add `gh pr merge` to the
# script — the lane sits one API call away from being an unattended production
# deploy path, and that call will always look harmless.
#
# CADENCE — 2h, and the reasoning is throughput, not latency.
# Nothing is at risk while this order waits: every constituent is an open PR,
# durable on the remote, and a human can merge any of them by hand at any time.
# So the cost of a wide interval is only that a bundle is offered less often.
# The cost of a TIGHT one is real: each run fetches, merges up to eight branches
# and runs a build, and a run that starts while the previous bundle is still
# unmerged mostly re-bundles the same set. Against ~50 merges a day, 2h offers a
# bundle about a dozen times a day, which is more often than a human clears the
# queue. That puts this with the reapers, not with `pool-spawn`'s 1m race.
#
# The lane is SILENT when it has nothing to add: fewer than two mergeable pull
# requests means there is no combination to test, and the run ends without
# creating a branch and without mailing. So tightening the interval does not
# make the mayor's inbox noisier on a quiet queue — it just spends more cycles
# discovering the queue is quiet.
#
# Configuration lives in roster.conf (all optional):
#   INTEGRATION_LANE_BUNDLE_SIZE      8      PRs per bundle; reported every run
#   INTEGRATION_LANE_VERIFY           go build ./... && go vet ./...
#   INTEGRATION_LANE_PREPARE          auto   what makes the tree buildable first;
#                                            `auto` generates templ views at the
#                                            go.mod-pinned version (*_templ.go is
#                                            gitignored, so a fresh worktree cannot
#                                            build without it). A failure HERE is a
#                                            LANE fault and ejects nobody.
#   INTEGRATION_LANE_VERIFY_TIMEOUT   900    seconds, per verify attempt
#   INTEGRATION_LANE_MAX_EJECTIONS    3      culprit ejections before giving up
#   INTEGRATION_LANE_MERGE_POLLS      5      mergeability re-queries per PR
#   INTEGRATION_LANE_LOCK_STALE_MIN   90     minutes before a lock is abandoned
#   INTEGRATION_LANE_RIGS             ""     narrow to named rigs; empty = all
#   INTEGRATION_LANE_REQUIRE_APPROVAL 0      1 = only APPROVED PRs may be bundled
#
# That last one is the only POLICY setting here. By default the lane refuses a
# CHANGES_REQUESTED pull request but does not require an approval: review quality
# is out of scope for this lane (PRD #340), and `reviewDecision` is a latch that
# stays CHANGES_REQUESTED after the author has already pushed the fix. Flip it to
# 1 in a city that would rather bundle only reviewed work and accept smaller
# bundles — the trade is that a human merging a bundle of eight is otherwise
# implicitly waving through any constituent nobody read.
[order]
description = "Bundle the currently-mergeable pull requests onto one integration branch, test the combination, and hand the mayor one reviewable merge — never merging it"
trigger = "cooldown"
interval = "2h"
exec = "$PACK_DIR/assets/scripts/integration-lane.sh"
