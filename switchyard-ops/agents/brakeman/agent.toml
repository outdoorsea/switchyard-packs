# brakeman — the switchyard worker pool. One agent, N concurrent sessions.
#
# A brakeman claims a routed work bead, builds it in a bead-scoped worktree,
# pushes the branch, and opens a pull request for it. This is the unit you sling
# work to:
#
#   gc sling <rig>/switchyard-ops.brakeman <bead-id>
#
# ...or list it in the rig's `default_sling_targets` so a bare `gc sling <bead>`
# lands here. Routing is by metadata: `gc` stamps `gc.routed_to=<qualified
# name>` on the bead, and each session's work query claims beads addressed to
# its own pool.
#
# scope = "rig": this agent only materializes where the pack is imported PER RIG
# (`[rigs.imports.switchyard-ops]`). Importing switchyard-ops city-wide gives you
# the orders; importing it into a rig gives you the workers. Most cities want both.
#
# Individual session names come from namepool.txt — see the note there.
#
# NOTE ON FORMULAS: a brakeman runs this pack's own `sy-item-work`, which
# extends gascity's `implementation-base` and adds the publish leg. See
# formulas/sy-item-work.formula.toml for why that leg cannot be gascity's
# `publish` formula and must not be optional.
#
# There is NO REFINERY in a gascity city, which changes two long-standing rules:
#
#   1. The worker opens its own PR. Nothing merges on its behalf, so an
#      unpublished branch is simply lost work.
#   2. The worker closes its own source anchor — the exact inverse of the
#      gastown lane, where closing was forbidden because the refinery closed
#      after verifying the merge. `sy-item-work` orders the close AFTER publish
#      so "closed" still implies "a human can see it".
#
# NO `binding_prefix` IS REQUIRED. Under gastown this agent needed
# `formula_vars = { binding_prefix = "gastown." }` on every rig, because
# `mol-polecat-work` rendered its refinery target from the binding of the pack
# that COOKED the formula (switchyard-ops), producing a handoff to an agent
# nobody ships. With no refinery there is no target to render, so that landmine
# is gone rather than relocated — delete the setting when migrating a rig.
scope = "rig"

# fresh: a worker starts each turn with a clean context. Resuming a build worker
# replays a finished build for no benefit and burns the window.
wake_mode = "fresh"

# Worktrees are scoped to the work bead, not the agent, so a session can pick up
# new work while an old worktree is still being recovered.
work_dir = ".gc/worktrees/{{.Rig}}/workers/{{.AgentBase}}"

nudge = "Run gc hook --claim --json now; if it returns work, execute the claimed formula immediately."

# Owned by this pack. It began as a copy of gastown's
# assets/scripts/worktree-setup.sh (sha256 ab0a5ed4770dd27b3961fd7f1f5714cf55
# d30d1d9022127349a6a55cffb6a9c1) and is still byte-identical to it, but gastown
# is no longer a dependency, so there is no upstream to track it against and no
# sha to re-verify on a bump — changes land here.
#
# It stays a file in this pack because {{.ConfigDir}} resolves to THIS pack: a
# pack cannot reach into a sibling's assets. Note this sets up the SESSION's
# worktree; gascity's prepare-worktree step separately scopes a worktree per
# work item, and the two are not redundant.
pre_start = ["{{.ConfigDir}}/assets/scripts/worktree-setup.sh {{.RigRoot}} {{.WorkDir}} {{.AgentBase}} --sync"]

idle_timeout = "2h"

# min 0: an idle worker is pure token burn, and claims are cheap. The pool scales
# up on demand and drains back to nothing. Raise max_active_sessions to widen the
# yard; namepool.txt must hold at least that many names.
min_active_sessions = 0
max_active_sessions = 4

# `gc sling <rig>/switchyard-ops.brakeman <bead>` attaches this formula
# automatically (`gc formula cook sy-item-work --attach <bead>`); pass
# --no-formula to route a raw bead instead.
#
# This is not a convenience. A bead routed to a worker WITHOUT a formula goes
# in_progress, never releases its assignee, and every later `gc hook --claim` on
# that session returns existing_assignment for it — forever. A session waking
# fresh after compaction cannot distinguish "assigned and done" from "assigned
# and not started", so it loops. The default makes the safe path the easy one.
default_sling_formula = "sy-item-work"
