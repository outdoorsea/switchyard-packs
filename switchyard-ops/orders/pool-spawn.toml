# Detect each non-suspended rig's claimable brakeman demand (switchyard PRD #185).
#
# The controller's dispatch has been dead for days because the machinery that
# spots demand and spawns a worker lives in the unsupported gc binary. This
# order gives switchyard-ops dispatch independence by doing that job itself. It
# enumerates every non-suspended rig and identifies the pool demand a fresh
# brakeman could actually claim: an open, unassigned, real work bead (not a
# self-blocked molecule root) routed to the rig's worker pool, with a WIP slot
# free. For each such spawn-ready rig it then spawns exactly one brakeman via
# `gc session new --no-attach`, captures the adhoc session identity, and
# direct-assigns that rig's next demand bead to it. Any spawn-or-assign failure —
# no session identity, a rejected assign, or a bead still unclaimed a full cycle
# after it was handed off — is mailed to the mayor within the cycle, matching
# switchyard-ops' silent-failure-becomes-mail invariant. The finer live-assignee
# reassign guard and cross-cycle bounding are sibling PRD #185 criteria that build
# on the demand set computed here.
#
# Cadence is 1m, not a sweep interval: pool dispatch is a RACE (the whole point
# is a worker starts within an order cycle), so this runs at the tight end of
# the PRD's 1-2 minute window, like publish-gate's 5m cadence rather than the 6h
# reapers.
# TWO DISPATCH TOPOLOGIES (switchyard PRD #327, crit:53605636a114). Everything
# above describes the local-`bd` ledger, which is still the default. A rig named in
# roster.conf's CLOUD_POOL_RIGS instead takes its demand from switchyard's managed
# CLOUD claim pool and dispatches with no `bd` read, no direct-assign and no cursor
# file: that claim is atomic and server-side, so the spawned brakeman claims for
# itself and there is no hand-off to race, guard or remember. The cutover is opt-in
# per rig, and a city that sets nothing behaves exactly as it did before. The cloud
# probe fails CLOSED — an unreadable pool spawns nothing and mails, because there it
# is the only evidence of demand there is.

[order]
description = "Spawn one brakeman per non-suspended rig with claimable demand and a free WIP slot — from the rig's bd ledger (direct-assigning the demand bead) or, for a rig cut over via CLOUD_POOL_RIGS, from switchyard's cloud claim pool (no bd, no assign, no cursor)"
trigger = "cooldown"
interval = "1m"
exec = "$PACK_DIR/assets/scripts/pool-spawn.sh"
